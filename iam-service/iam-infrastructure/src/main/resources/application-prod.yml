spring:

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    validate-on-migrate: true
    clean-disabled: true

  kafka:
    consumer:
      group-id: iam-service-group

server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    bundle: ${SERVER_SSL_BUNDLE:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

application:
  translation:
    client:
      base-url: ${TRANSLATION_SERVICE_URL}

logging:
  level:
    ROOT: WARN
    com.vertyll.veds: INFO
    org.springframework.security: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
