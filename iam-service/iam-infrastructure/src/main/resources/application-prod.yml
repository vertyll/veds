spring:

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        format_sql: false

  flyway:
    clean-disabled: true

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    bundle: ${SERVER_SSL_BUNDLE:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

application:
  translation:
    client:
      base-url: ${TRANSLATION_SERVICE_URL}

logging:
  level:
    ROOT: WARN
    com.vertyll.veds: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
