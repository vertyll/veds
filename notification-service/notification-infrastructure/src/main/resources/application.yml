spring:
  application:
    name: notification-service

  profiles:
    default: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

  flyway:
    validate-on-migrate: true

  kafka:
    consumer:
      group-id: notification-service-group

server:
  port: ${SERVER_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
    metrics:
      access: read-only

logging:
  level:
    org.springframework.kafka: INFO
