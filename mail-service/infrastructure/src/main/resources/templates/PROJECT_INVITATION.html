<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{_layout :: page('Project invitation', ~{::content})}">
<body>
    <div th:fragment="content" th:remove="tag">
        <p style="margin: 0 0 16px; font-size: 15px; color: #e8e8e8;">You have been invited to join a project on VEDS.</p>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin: 0 0 8px;">
            <tr>
                <td style="background-color: #121212; border: 1px solid #303030; padding: 12px 16px; font-size: 14px;">
                    <span style="color: #a0a0a0;">Project:</span>
                    <strong style="color: #e8e8e8;" th:text="${projectName}">value</strong>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
