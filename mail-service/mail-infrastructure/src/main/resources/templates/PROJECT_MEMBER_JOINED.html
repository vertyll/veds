<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{_layout :: page('New project member', ~{::content})}">
<head>
    <title>New project member</title>
</head>
<body>
    <div th:fragment="content" th:remove="tag">
        <p style="margin: 0 0 16px; font-size: 15px; color: #e8e8e8;">A new member has joined a project you take part in.</p>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; border-collapse: collapse; margin: 0 0 8px;">
            <tr>
                <td bgcolor="#121212" style="background-color: #121212; border: 1px solid #303030; padding: 12px 16px; font-size: 14px;">
                    <span style="color: #a0a0a0;">Role:</span>
                    <strong style="color: #e8e8e8;" th:text="${roleName}">value</strong>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
