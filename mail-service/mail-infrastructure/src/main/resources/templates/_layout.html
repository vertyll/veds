<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(heading, body)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">
    <title th:text="${heading}">VEDS</title>
</head>
<body style="margin: 0; padding: 0; background-color: #121212; color: #e8e8e8; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; border-collapse: collapse; background-color: #121212;">
    <tr>
        <td align="center" bgcolor="#121212" style="padding: 40px 16px;">
            <table role="presentation" width="560" align="center" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 560px; border-collapse: collapse;">
                <tr>
                    <td style="padding: 0 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a0a0a0;">VEDS</td>
                </tr>
                <tr>
                    <td bgcolor="#1a1a1a" style="background-color: #1a1a1a; border: 1px solid #303030; padding: 32px; overflow-wrap: anywhere;">
                        <h1 style="margin: 0 0 20px; font-size: 22px; font-weight: 600; line-height: 1.3; color: #e8e8e8;" th:text="${heading}">Heading</h1>
                        <div th:replace="${body}">Content</div>
                        <p style="margin: 24px 0 0; padding-top: 16px; border-top: 1px solid #303030; font-size: 13px; color: #a0a0a0;">Sign in to VEDS to see the details.</p>
                        <p style="margin: 16px 0 0; font-size: 14px; color: #e8e8e8;">Best regards,<br>The VEDS Team</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 16px 0 0; font-size: 12px; text-align: center; color: #a0a0a0;">
                        <p style="margin: 0 0 4px;">&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> VEDS. All rights reserved.</p>
                        <p style="margin: 0 0 4px;">This is an automated message, please do not reply.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
