spring:
  thymeleaf:
    cache: true

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        format_sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            checkserveridentity: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

application:
  mail:
    from: ${MAIL_FROM}
  authz:
    client:
      base-url: ${IAM_SERVICE_URL}
  translation:
    client:
      base-url: ${TRANSLATION_SERVICE_URL}

logging:
  level:
    ROOT: WARN
    com.vertyll.veds: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.springframework.mail: INFO
