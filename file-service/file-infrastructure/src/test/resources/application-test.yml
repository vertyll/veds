spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
  kafka:
    consumer:
      group-id: file-service-test
    properties:
      schema.registry.url: mock://file-service-test

application:
  translation:
    client:
      base-url: http://localhost:1
  file:
    storage:
      endpoint: http://localhost:1
      region: garage
      bucket: veds-files-test
      access-key: test-access-key
      secret-key: test-secret-key

logging:
  level:
    com.vertyll.veds: DEBUG
    org.testcontainers: INFO
