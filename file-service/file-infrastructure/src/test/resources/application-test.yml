spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: file-service-test
    properties:
      schema.registry.url: mock://file-service-test

application:
  translation:
    client:
      base-url: http://localhost:1
  file:
    storage:
      endpoint: http://localhost:1
      region: garage
      bucket: veds-files-test
      access-key: test-access-key
      secret-key: test-secret-key
      upload-url-validity: 15m
      download-url-validity: 5m

logging:
  level:
    com.vertyll.veds: DEBUG
    org.testcontainers: INFO
