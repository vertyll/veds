spring:
  application:
    name: file-service

  profiles:
    default: local

  threads:
    virtual:
      enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

  kafka:
    consumer:
      group-id: file-service-group

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
    metrics:
      access: read-only

application:
  file:
    storage:
      upload-url-validity: 15m
      download-url-validity: 5m

logging:
  level:
    org.springframework.kafka: INFO
