spring:
  application:
    name: api-gateway

  profiles:
    default: local

  main:
    web-application-type: reactive

  data:
    redis:
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

  session:
    timeout: ${GATEWAY_SESSION_TTL:7d}
    data:
      redis:
        namespace: ${application.redis.key-prefix}:session

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 30s
    config:
      enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  reactive:
    session:
      cookie:
        name: __Host-VEDS_SESSION
        http-only: true
        same-site: strict
        secure: ${application.shared.keycloak.cookie.secure}
        path: /
        max-age: ${GATEWAY_SESSION_TTL:7d}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

application:
  redis:
    key-prefix: veds
  gateway:
    oauth:
      service-audiences:
        - veds-iam-service
        - veds-mail-service
        - veds-project-service
        - veds-task-service
        - veds-translation-service
        - veds-file-service
        - veds-notification-service
