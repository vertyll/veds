spring:
  application:
    name: api-gateway

  profiles:
    default: local

  main:
    web-application-type: reactive

  data:
    redis:
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

  session:
    timeout: 10h
    data:
      redis:
        namespace: ${application.redis.key-prefix}:session

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 30s
          routes:
            - id: iam-service
              uri: ${application.gateway.services.iam}
              predicates:
                - Path=/auth/**, /users/**, /roles/**, /permissions/**
              filters:
                - TokenRelay=veds-iam-service
            - id: mail-service
              uri: ${application.gateway.services.mail}
              predicates:
                - Path=/mail/**
              filters:
                - TokenRelay=veds-mail-service
            - id: project-service
              uri: ${application.gateway.services.project}
              predicates:
                - Path=/projects/**, /project-types/**, /project-roles/**, /project-user-roles/**
              filters:
                - TokenRelay=veds-project-service
            - id: task-service
              uri: ${application.gateway.services.task}
              predicates:
                - Path=/tasks/**
              filters:
                - TokenRelay=veds-task-service
            - id: translation-service
              uri: ${application.gateway.services.translation}
              predicates:
                - Path=/translations/**, /admin/translations/**
              filters:
                - TokenRelay=veds-translation-service
            - id: file-service
              uri: ${application.gateway.services.file}
              predicates:
                - Path=/files/**
              filters:
                - TokenRelay=veds-file-service
            - id: notification-service
              uri: ${application.gateway.services.notification}
              predicates:
                - Path=/notifications/**, /ws/notifications/**
              filters:
                - TokenRelay=veds-notification-service
    config:
      enabled: false
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false

server:
  port: ${SERVER_PORT:8080}
  reactive:
    session:
      cookie:
        name: __Host-VEDS_SESSION
        http-only: true
        same-site: strict
        secure: ${application.shared.keycloak.cookie.secure}
        path: /

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

application:
  redis:
    key-prefix: veds
  gateway:
    oauth:
      service-audiences:
        - veds-iam-service
        - veds-mail-service
        - veds-project-service
        - veds-task-service
        - veds-translation-service
        - veds-file-service
        - veds-notification-service
