spring:
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
        bundle: ${REDIS_SSL_BUNDLE:}

  web:
    resources:
      add-mappings: false

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    bundle: ${SERVER_SSL_BUNDLE:}

application:
  gateway:
    services:
      iam: ${IAM_SERVICE_URL}
      mail: ${MAIL_SERVICE_URL}
      project: ${PROJECT_SERVICE_URL}
      task: ${TASK_SERVICE_URL}
      translation: ${TRANSLATION_SERVICE_URL}
      file: ${FILE_SERVICE_URL}
      notification: ${NOTIFICATION_SERVICE_URL}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    session:
      encryption-key: ${GATEWAY_SESSION_ENCRYPTION_KEY}
    oauth:
      redirect-uri: ${KEYCLOAK_REDIRECT_URI}
      post-login-redirect-uri: ${APP_POST_LOGIN_REDIRECT_URI}

logging:
  level:
    root: WARN
    com.vertyll.veds: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    reactor.netty.http.client: INFO
