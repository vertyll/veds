spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
        bundle: ${REDIS_SSL_BUNDLE:}

  web:
    resources:
      add-mappings: false

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: iam-service
              uri: ${IAM_SERVICE_URL}
              predicates:
                - Path=/auth/**, /users/**, /roles/**, /permissions/**
              filters:
                - TokenRelay=veds-iam-service
            - id: mail-service
              uri: ${MAIL_SERVICE_URL}
              predicates:
                - Path=/mail/**
              filters:
                - TokenRelay=veds-mail-service
            - id: project-service
              uri: ${PROJECT_SERVICE_URL}
              predicates:
                - Path=/projects/**, /project-types/**, /project-roles/**, /project-user-roles/**
              filters:
                - TokenRelay=veds-project-service
            - id: task-service
              uri: ${TASK_SERVICE_URL}
              predicates:
                - Path=/tasks/**
              filters:
                - TokenRelay=veds-task-service
            - id: translation-service
              uri: ${TRANSLATION_SERVICE_URL}
              predicates:
                - Path=/translations/**, /admin/translations/**
              filters:
                - TokenRelay=veds-translation-service
            - id: file-service
              uri: ${FILE_SERVICE_URL}
              predicates:
                - Path=/files/**
              filters:
                - TokenRelay=veds-file-service
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL}
              predicates:
                - Path=/notifications/**, /ws/notifications/**
              filters:
                - TokenRelay=veds-notification-service

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    bundle: ${SERVER_SSL_BUNDLE:}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

application:
  shared:
    keycloak:
      cookie:
        secure: true
  gateway:
    cors:
      allowed-origins:
        - "${CORS_ALLOWED_ORIGINS}"
    session:
      encryption-key: ${GATEWAY_SESSION_ENCRYPTION_KEY}
    oauth:
      redirect-uri: ${KEYCLOAK_REDIRECT_URI}
      post-login-redirect-uri: ${APP_POST_LOGIN_REDIRECT_URI}

logging:
  level:
    root: WARN
    com.vertyll.veds: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    reactor.netty.http.client: INFO
