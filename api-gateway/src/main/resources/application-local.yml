spring:
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:local-redis-password}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/auth/**, /users/**, /roles/**, /permissions/**
            - id: mail-service
              uri: ${MAIL_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/mail/**
            - id: project-service
              uri: ${PROJECT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/projects/**, /project-types/**, /project-roles/**, /project-user-roles/**
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/tasks/**
            - id: translation-service
              uri: ${TRANSLATION_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/translations/**, /admin/translations/**
            - id: file-service
              uri: ${FILE_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/files/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/notifications/**, /ws/notifications/**

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.vertyll.veds: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    reactor.netty.http.client: DEBUG

veds:
  gateway:
    cors:
      allowed-origins:
        - "http://localhost:4200"
    session:
      encryption-key: ${GATEWAY_SESSION_ENCRYPTION_KEY:ZTeJ0h/U451Ooa3ePJvmh1K0WaNTk8rq6TsWTNGQBzo=}
      ttl: ${GATEWAY_SESSION_TTL:7d}
    oauth:
      redirect-uri: http://localhost:8080/auth/callback
      post-login-redirect-uri: "http://localhost:4200/"
