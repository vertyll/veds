spring:
  data:
    redis:
      host: localhost
      password: ${REDIS_PASSWORD:local-redis-password}

server:
  reactive:
    session:
      cookie:
        # The __Host- prefix requires Secure, which plain HTTP cannot have.
        name: VEDS_SESSION

application:
  gateway:
    services:
      iam: ${IAM_SERVICE_URL:http://localhost:8082}
      mail: ${MAIL_SERVICE_URL:http://localhost:8083}
      project: ${PROJECT_SERVICE_URL:http://localhost:8084}
      task: ${TASK_SERVICE_URL:http://localhost:8085}
      translation: ${TRANSLATION_SERVICE_URL:http://localhost:8087}
      file: ${FILE_SERVICE_URL:http://localhost:8088}
      notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
    cors:
      allowed-origins:
        - "http://localhost:4200"
    session:
      encryption-key: ${GATEWAY_SESSION_ENCRYPTION_KEY:ZTeJ0h/U451Ooa3ePJvmh1K0WaNTk8rq6TsWTNGQBzo=}
    oauth:
      redirect-uri: http://localhost:8080/auth/callback
      post-login-redirect-uri: "http://localhost:4200/"

logging:
  level:
    root: INFO
    com.vertyll.veds: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    reactor.netty.http.client: DEBUG
