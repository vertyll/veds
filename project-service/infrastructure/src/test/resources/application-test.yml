spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: project-service-test
    properties:
      schema.registry.url: mock://project-service-test

veds:
  authz:
    client:
      base-url: http://localhost:1
  translation:
    supported-languages: pl,en
    client:
      base-url: http://localhost:1
  saga:
    await-response-timeout: 30s
    compensation-retry-cooldown: 5s

logging:
  level:
    com.vertyll.veds: DEBUG
    org.testcontainers: INFO
