spring:
  application:
    name: project-service

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50

  kafka:
    consumer:
      group-id: project-service-group

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
    metrics:
      access: read-only

application:
  translation:
    supported-languages: ${SUPPORTED_LANGUAGES:pl,en}
