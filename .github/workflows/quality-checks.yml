name: Quality

on:
  workflow_call:
    inputs:
      service:
        description: Gradle subproject directory, for example iam-service
        required: true
        type: string
      runner:
        description: GitHub runner label
        required: false
        type: string
        default: ubuntu-24.04
      hexagonal:
        description: Run checkHexagonalDependencies. Only the -service builds register that task.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ktlint:
    name: ktlint
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        working-directory: ${{ inputs.service }}
        run: chmod +x ./gradlew

      - name: Run ktlint
        working-directory: ${{ inputs.service }}
        run: ./gradlew --no-daemon ktlintCheck

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports-${{ inputs.service }}
          path: |
            ${{ inputs.service }}/build/reports/ktlint/
            ${{ inputs.service }}/*/build/reports/ktlint/
          if-no-files-found: ignore

  detekt:
    name: detekt
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        working-directory: ${{ inputs.service }}
        run: chmod +x ./gradlew

      - name: Run detekt
        working-directory: ${{ inputs.service }}
        run: ./gradlew --no-daemon detekt

      - name: Upload detekt reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports-${{ inputs.service }}
          path: |
            ${{ inputs.service }}/build/reports/detekt/
            ${{ inputs.service }}/*/build/reports/detekt/
          if-no-files-found: ignore

  test:
    name: Test
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        working-directory: ${{ inputs.service }}
        run: chmod +x ./gradlew

      - name: Run tests
        working-directory: ${{ inputs.service }}
        run: ./gradlew --no-daemon test -PintegrationTests

      - name: Analyze
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ inputs.service }}
        run: ./gradlew --no-daemon sonar -PintegrationTests
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ inputs.service }}
          path: |
            ${{ inputs.service }}/build/reports/tests/
            ${{ inputs.service }}/*/build/reports/tests/
          if-no-files-found: ignore
  hexagonal:
    name: Hexagonal
    if: ${{ inputs.hexagonal }}
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        working-directory: ${{ inputs.service }}
        run: chmod +x ./gradlew

      # Fails if a framework reaches the application layer's resolved compile classpath.
      - name: Run checkHexagonalDependencies
        working-directory: ${{ inputs.service }}
        run: ./gradlew --no-daemon checkHexagonalDependencies
