name: Task Service

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "task-service/**"
      - "shared-web/**"
      - "shared-error/**"
      - "shared-archunit/**"
      - "shared-translation-client/**"
      - "shared-messaging-kafka/**"
      - "task-contracts/**"
      - "project-contracts/**"
      - "iam-contracts/**"
      - "file-contracts/**"
      - "contracts/**"
      - "shared-authz/**"
      - "shared-authz-client/**"
      - "shared-translation/**"
      - ".github/workflows/task-service.yml"
      - ".github/workflows/_image.yml"
      - ".github/workflows/quality-checks.yml"
  pull_request:
    branches:
      - main
    paths:
      - "task-service/**"
      - "shared-web/**"
      - "shared-error/**"
      - "shared-archunit/**"
      - "shared-translation-client/**"
      - "shared-messaging-kafka/**"
      - "task-contracts/**"
      - "project-contracts/**"
      - "iam-contracts/**"
      - "file-contracts/**"
      - "contracts/**"
      - "shared-authz/**"
      - "shared-authz-client/**"
      - "shared-translation/**"
      - ".github/workflows/task-service.yml"
      - ".github/workflows/_image.yml"
      - ".github/workflows/quality-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality-checks.yml
    with:
      service: task-service
      hexagonal: true

  image:
    name: Image
    needs: quality
    if: github.event_name != 'push' || github.ref_type == 'tag'
    uses: ./.github/workflows/_image.yml
    with:
      context: .
      dockerfile: ./task-service/Dockerfile
      image-name: vertyll/veds-task-service
      tag-prefix: v
    secrets: inherit
