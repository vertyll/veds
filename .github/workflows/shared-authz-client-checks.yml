name: Shared Authz Client

on:
  push:
    branches:
      - main
    paths:
      - "shared-authz-client/**"
      - "shared-authz/**"
      - ".github/workflows/shared-authz-client-checks.yml"
      - ".github/workflows/quality-checks.yml"
  pull_request:
    branches:
      - main
    paths:
      - "shared-authz-client/**"
      - "shared-authz/**"
      - ".github/workflows/shared-authz-client-checks.yml"
      - ".github/workflows/quality-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality-checks.yml
    with:
      service: shared-authz-client
