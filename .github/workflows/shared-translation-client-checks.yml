name: Shared Translation Client Checks

on:
  push:
    branches:
      - main
    paths:
      - "shared-translation-client/**"
      - "shared-translation/**"
      - ".github/workflows/shared-translation-client-checks.yml"
      - ".github/workflows/quality-checks.yml"
  pull_request:
    branches:
      - main
    paths:
      - "shared-translation-client/**"
      - "shared-translation/**"
      - ".github/workflows/shared-translation-client-checks.yml"
      - ".github/workflows/quality-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality-checks.yml
    with:
      service: shared-translation-client
