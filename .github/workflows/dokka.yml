name: KDoc

on:
  push:
    branches:
      - main
    paths:
      - "shared-web/**"
      - "shared-saga-api/**"
      - "shared-saga-engine/**"
      - "shared-translation-client/**"
      - "shared-messaging-kafka/**"
      - "shared-translation/**"
      - "shared-authz/**"
      - "shared-authz-client/**"
      - "build.gradle.kts"
      - ".github/workflows/dokka.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrappers executable
        run: chmod +x ./gradlew shared-*/gradlew

      - name: Generate Dokka HTML
        run: ./gradlew --no-daemon docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Dokka artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dokka

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5