name: File Service

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "file-service/**"
      - "shared-web/**"
      - "shared-error/**"
      - "shared-archunit/**"
      - "shared-translation-client/**"
      - "shared-messaging-kafka/**"
      - "file-contracts/**"
      - "contracts/**"
      - "shared-authz/**"
      - "shared-translation/**"
      - ".github/workflows/file-service.yml"
      - ".github/workflows/_image.yml"
      - ".github/workflows/quality-checks.yml"
  pull_request:
    branches:
      - main
    paths:
      - "file-service/**"
      - "shared-web/**"
      - "shared-error/**"
      - "shared-archunit/**"
      - "shared-translation-client/**"
      - "shared-messaging-kafka/**"
      - "file-contracts/**"
      - "contracts/**"
      - "shared-authz/**"
      - "shared-translation/**"
      - ".github/workflows/file-service.yml"
      - ".github/workflows/_image.yml"
      - ".github/workflows/quality-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality-checks.yml
    with:
      service: file-service
      hexagonal: true
    secrets: inherit

  image:
    name: Image
    needs: quality
    if: github.event_name != 'push' || github.ref_type == 'tag'
    uses: ./.github/workflows/_image.yml
    with:
      context: .
      dockerfile: ./file-service/Dockerfile
      image-name: vertyll/veds-file-service
      tag-prefix: v
    secrets: inherit
