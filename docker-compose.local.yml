name: veds

services:
  iam-db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    volumes:
      - iam-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iam_db
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iam_db -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mail-db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    volumes:
      - mail-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mail_service
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mail_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  project-db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    volumes:
      - project-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_service
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  task-db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    volumes:
      - task-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_service
    ports:
      - "127.0.0.1:5436:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    volumes:
      - notification-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification_service
    ports:
      - "127.0.0.1:5437:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  translation-db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    volumes:
      - translation-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: translation_service
    ports:
      - "127.0.0.1:5438:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d translation_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  file-db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    volumes:
      - file-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: file_service
    ports:
      - "127.0.0.1:5439:5432"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d file_service -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway-session-store:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD:-local-redis-password}"
      - "--maxmemory-policy"
      - "noeviction"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-local-redis-password}
    volumes:
      - gateway-session-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redisinsight:
    image: docker.io/redis/redisinsight:3.8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:5540"
    networks:
      - microservices-network

  object-storage:
    image: docker.io/dxflrs/garage:v2.4.1
    restart: unless-stopped
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - object-storage-data:/var/lib/garage/data
      - object-storage-meta:/var/lib/garage/meta
    ports:
      - "127.0.0.1:9100:3900"
      - "127.0.0.1:9102:3903"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  object-storage-init:
    image: docker.io/library/alpine:3.24
    depends_on:
      object-storage:
        condition: service_healthy
    volumes:
      - ./infra/garage/bootstrap.sh:/bootstrap.sh:ro
    environment:
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-veds-files}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-GK7b3f9c1e4a5d2086f1c3b5a7}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-4f8a1c6e9b2d5307a8e1f4c7b0d3a6e92c5f8b1d4a7e0c3f6b9d2a5e8c1f4b7d}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      GARAGE_ADMIN_URL: http://object-storage:3903
      GARAGE_ADMIN_TOKEN: veds-local-admin-token
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq >/dev/null && sh /bootstrap.sh"]
    restart: "no"
    networks:
      - microservices-network

  object-storage-ui:
    image: docker.io/noooste/garage-ui:v0.13.0
    restart: unless-stopped
    depends_on:
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
    environment:
      GARAGE_UI_GARAGE_TOML: /etc/garage.toml
      GARAGE_UI_GARAGE_ENDPOINT: http://object-storage:3900
      GARAGE_UI_GARAGE_ADMIN_ENDPOINT: http://object-storage:3903
    ports:
      - "127.0.0.1:9101:8080"
    networks:
      - microservices-network

  kafka:
    image: docker.io/confluentinc/cp-kafka:8.3.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  schema-registry:
    image: docker.io/confluentinc/cp-schema-registry:8.3.2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: "1"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /subjects HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  topics-init:
    image: docker.io/hashicorp/terraform:1.16.4
    depends_on:
      kafka:
        condition: service_healthy
    working_dir: /infra
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        terraform init -input=false -no-color &&
        terraform apply -auto-approve -input=false -no-color
        -var='bootstrap_servers=["kafka:9092"]'
        -var=replication_factor=1
        -var=partitions=1
    volumes:
      - ./infra/kafka:/infra
      - topics-state:/state
    networks:
      - microservices-network
    restart: "no"

  schemas-init:
    image: docker.io/library/python:3.14-alpine
    depends_on:
      schema-registry:
        condition: service_healthy
    working_dir: /work
    command:
      - python
      - scripts/schema_registry/register_schemas.py
      - --registry-url
      - http://schema-registry:8081
      - --compatibility
      - BACKWARD
    volumes:
      - ./scripts:/work/scripts:ro
      - ./contracts:/work/contracts:ro
    networks:
      - microservices-network
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_pass
      KC_DB_SCHEMA: public
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:9000:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./keycloak/realm-config/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - microservices-network
    healthcheck:
      test: [ "CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  keycloak-db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully
      schemas-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  maildev:
    image: docker.io/maildev/maildev:3.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:1080:1080"
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:1080/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  microservices-network:
    driver: bridge

volumes:
  iam-postgres-data:
  mail-postgres-data:
  project-postgres-data:
  task-postgres-data:
  notification-postgres-data:
  translation-postgres-data:
  file-postgres-data:
  object-storage-data:
  object-storage-meta:
  gateway-session-data:
  kafka-data:
  topics-state:
  keycloak-postgres-data:
